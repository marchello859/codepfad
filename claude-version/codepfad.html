<title>Codepfad</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Sora:wght@500;600;700&display=swap">
<style>
/* Layout: app shell — sidebar on desktop, top bar + bottom tab bar on phones; content column max 880px */
:root {
  --bg: #F3F5F8;
  --surface: #FFFFFF;
  --surface-2: #ECEFF4;
  --ink: #131923;
  --muted: #5B6576;
  --line: #DEE3EB;
  --accent: #2F5BEA;
  --accent-ink: #FFFFFF;
  --accent-soft: #E7ECFE;
  --ok: #12804A;
  --ok-soft: #E2F4E9;
  --bad: #C42F3A;
  --bad-soft: #FCE7E8;
  --warn: #A86400;
  --warn-soft: #FFF0D9;
  --code-bg: #10151F;
  --code-line: #1E2533;
  --code-ink: #DCE3EF;
  --code-muted: #6D7A90;
  --t-kw: #93AEFF;
  --t-str: #9FDDB0;
  --t-num: #FFC27A;
  --t-com: #6D7A90;
  --t-pre: #F49CCB;
  --t-fn: #7FD6E8;
  --shadow: 0 1px 2px rgba(19, 25, 35, .05), 0 6px 20px rgba(19, 25, 35, .05);
  --font-ui: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display: "Sora", "Figtree", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  --r: 14px;
  --r-sm: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C0F15; --surface: #141922; --surface-2: #1B212C; --ink: #E6EAF1; --muted: #96A0B2; --line: #252D3A;
    --accent: #7E9CFF; --accent-ink: #0C0F15; --accent-soft: #1C2645;
    --ok: #4CC98A; --ok-soft: #12291C; --bad: #FF7B83; --bad-soft: #351719; --warn: #F2B35A; --warn-soft: #2F230F;
    --code-bg: #090C11; --code-line: #171D28; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C0F15; --surface: #141922; --surface-2: #1B212C; --ink: #E6EAF1; --muted: #96A0B2; --line: #252D3A;
  --accent: #7E9CFF; --accent-ink: #0C0F15; --accent-soft: #1C2645;
  --ok: #4CC98A; --ok-soft: #12291C; --bad: #FF7B83; --bad-soft: #351719; --warn: #F2B35A; --warn-soft: #2F230F;
  --code-bg: #090C11; --code-line: #171D28; --shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 16px; line-height: 1.55; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.2; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(1.6rem, 4.5vw, 2.15rem); font-weight: 700; }
h2 { font-size: 1.2rem; font-weight: 600; }
h3 { font-size: 1.02rem; font-weight: 600; }
p { margin: 0; }
code { font-family: var(--font-mono); font-size: .88em; background: var(--surface-2); padding: .1em .35em; border-radius: 5px; }
.muted { color: var(--muted); }
.eyebrow { font-size: .74rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* ---------- shell ---------- */
.shell { min-height: 100%; }
.side { display: none; }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 12px; justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: 9px; font-family: var(--font-display); font-weight: 700; font-size: 1.08rem; letter-spacing: -0.02em; }
.brand-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-family: var(--font-mono); font-size: .8rem; font-weight: 600; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 11px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 11px; border-radius: 8px; font-weight: 600; font-size: .88rem; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px calc(96px + env(safe-area-inset-bottom, 0px)); }
.wrap { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.wrap.wide { max-width: 1240px; }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(4, 1fr);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.tabbar button { border: 0; background: none; padding: 9px 4px 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: .72rem; font-weight: 600; color: var(--muted); }
.tabbar button svg { width: 22px; height: 22px; }
.tabbar button[aria-current="page"] { color: var(--accent); }

@media (min-width: 900px) {
  .shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); }
  .side { display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; padding: 22px 16px; border-right: 1px solid var(--line); background: var(--surface); }
  .side nav { display: flex; flex-direction: column; gap: 2px; }
  .side nav button { border: 0; background: none; display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 10px; font-weight: 600; color: var(--muted); text-align: left; }
  .side nav button svg { width: 20px; height: 20px; }
  .side nav button:hover { background: var(--surface-2); color: var(--ink); }
  .side nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
  .side .sync { margin-top: auto; }
  .tabbar, .top .brand { display: none; }
  .top { justify-content: flex-end; }
  main { padding-block: 28px 48px; }
}

/* ---------- common pieces ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; box-shadow: var(--shadow); }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 10px 16px; border-radius: 11px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; }
.btn:hover { border-color: color-mix(in srgb, var(--ink) 25%, var(--line)); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: .9rem; }
.btn:disabled { opacity: .55; cursor: default; }
.btn svg { width: 18px; height: 18px; flex: none; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.lvl { display: inline-flex; align-items: center; gap: 6px; font-size: .75rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 3px 9px; border-radius: 99px; }
.lvl-1 { color: var(--ok); background: var(--ok-soft); }
.lvl-2 { color: var(--warn); background: var(--warn-soft); }
.lvl-3 { color: var(--bad); background: var(--bad-soft); }
.meter { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s ease; }
.ai-only { display: none !important; }
[data-ai="1"] .ai-only { display: revert !important; }
[data-ai="1"] .ai-only.flex { display: flex !important; }
.sync { font-size: .8rem; color: var(--muted); display: flex; align-items: center; gap: 7px; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.sync[data-s="synced"] i { background: var(--ok); }
.sync[data-s="saving"] i { background: var(--warn); }
.sync[data-s="error"] i { background: var(--bad); }

/* ---------- code ---------- */
.code { margin: 0; background: var(--code-bg); border-radius: var(--r-sm); overflow: hidden; color: var(--code-ink); }
.code-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 8px 6px 14px; border-bottom: 1px solid var(--code-line); font-family: var(--font-mono); font-size: .72rem; color: var(--code-muted); text-transform: uppercase; letter-spacing: .06em; }
.code-bar button { border: 0; background: transparent; color: var(--t-kw); font-family: var(--font-ui); font-size: .82rem; font-weight: 600; text-transform: none; letter-spacing: 0; padding: 4px 8px; border-radius: 7px; display: inline-flex; gap: 6px; align-items: center; }
.code-bar button:hover { background: var(--code-line); }
.code pre { margin: 0; padding: 14px 16px; overflow-x: auto; font-family: var(--font-mono); font-size: .86rem; line-height: 1.6; tab-size: 4; }
.code pre code { background: none; padding: 0; font-size: inherit; color: inherit; }
.t-kw { color: var(--t-kw); } .t-str { color: var(--t-str); } .t-num { color: var(--t-num); } .t-com { color: var(--t-com); font-style: italic; } .t-pre { color: var(--t-pre); } .t-fn { color: var(--t-fn); }

/* ---------- path ---------- */
.hero { display: flex; flex-direction: column; gap: 14px; padding: 24px; }
.hero p { color: var(--muted); max-width: 60ch; }
.hero .stats { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.level { display: flex; flex-direction: column; gap: 10px; }
.level-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 4px 2px; }
.level-head .count { margin-left: auto; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.lessons { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.lesson-row { width: 100%; display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 14px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 14px 16px; }
.lesson-row:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.ln-num { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-family: var(--font-mono); font-weight: 600; font-size: .9rem; background: var(--surface-2); color: var(--muted); }
.lesson-row.is-done .ln-num { background: var(--ok-soft); color: var(--ok); }
.ln-title { display: block; font-weight: 600; }
.ln-meta { display: block; font-size: .83rem; color: var(--muted); }
.ln-state { display: flex; gap: 6px; color: var(--muted); }
.ln-state svg { width: 20px; height: 20px; }
.ln-state .on { color: var(--ok); }
.ln-state .star.on { color: var(--warn); }

/* ---------- lesson ---------- */
.back { border: 0; background: none; color: var(--muted); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; padding: 6px 0; }
.back:hover { color: var(--ink); }
.back svg { width: 18px; height: 18px; }
.lesson { display: flex; flex-direction: column; gap: 16px; }
.lesson-meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: .85rem; color: var(--muted); }
.lesson > p { max-width: 68ch; font-size: 1.04rem; }
.tip { border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--line)); background: var(--accent-soft); border-radius: var(--r-sm); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.tip strong { font-size: .76rem; letter-spacing: .07em; text-transform: uppercase; color: var(--accent); }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

.q { display: flex; flex-direction: column; gap: 12px; padding: 18px; }
.q + .q { border-top: 1px solid var(--line); }
.q-text { font-weight: 600; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 11px; padding: 11px 14px; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: start; min-height: 48px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .k { width: 26px; height: 26px; border-radius: 7px; background: var(--surface-2); display: grid; place-items: center; font-size: .8rem; font-weight: 700; color: var(--muted); }
.opt .v { font-family: var(--font-mono); font-size: .9rem; overflow-wrap: anywhere; padding-top: 2px; }
.opt.v-text .v { font-family: var(--font-ui); font-size: .98rem; padding-top: 1px; }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .k { background: var(--ok); color: var(--surface); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .k { background: var(--bad); color: var(--surface); }
.why { border-radius: 11px; padding: 12px 14px; background: var(--surface-2); display: flex; flex-direction: column; gap: 8px; }
.why .verdict { font-weight: 700; }
.why .verdict.ok { color: var(--ok); }
.why .verdict.no { color: var(--bad); }
.task { display: flex; flex-direction: column; gap: 12px; }
.task .state { font-size: .9rem; font-weight: 600; display: flex; gap: 6px; align-items: center; }
.task .state.ok { color: var(--ok); }
.lesson-nav { display: flex; gap: 10px; justify-content: space-between; flex-wrap: wrap; }

.tutor { display: flex; flex-direction: column; gap: 12px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 7px 13px; font-size: .88rem; font-weight: 600; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.ask { display: flex; gap: 8px; }
.ask input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 11px; padding: 10px 14px; min-height: 44px; }
.answer { display: flex; flex-direction: column; gap: 10px; border-left: 3px solid var(--accent); padding: 4px 0 4px 14px; overflow-wrap: anywhere; min-width: 0; }
.answer:empty { display: none; }
.answer pre { margin: 0; background: var(--code-bg); color: var(--code-ink); padding: 12px 14px; border-radius: 10px; overflow-x: auto; font-family: var(--font-mono); font-size: .84rem; line-height: 1.55; }
.answer pre code { background: none; padding: 0; color: inherit; }
.answer ul, .answer ol { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 4px; }
.answer h4 { margin: 4px 0 0; font-family: var(--font-display); font-size: 1rem; }
.answer .thinking { color: var(--muted); display: flex; align-items: center; gap: 8px; }
.answer .err { color: var(--bad); }
.dots::after { content: "…"; animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .2; } }

/* ---------- quiz mode ---------- */
.quiz-top { display: flex; align-items: center; gap: 12px; }
.quiz-top .meter { flex: 1; }
.quiz-top span { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.result { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
.score { font-family: var(--font-display); font-size: 3rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: .85rem; font-weight: 600; color: var(--muted); }
.from { font-size: .8rem; color: var(--muted); }

/* ---------- playground ---------- */
.pg-grid { display: grid; gap: 14px; }
@media (min-width: 1100px) { .pg-grid { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; } }
.pg-task { display: flex; flex-direction: column; gap: 8px; border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); background: var(--accent-soft); border-radius: var(--r); padding: 14px 16px; }
.pg-task .row { justify-content: space-between; }
.verdict-bar { border-radius: 10px; padding: 10px 14px; font-weight: 600; }
.verdict-bar.ok { background: var(--ok-soft); color: var(--ok); }
.verdict-bar.no { background: var(--bad-soft); color: var(--bad); }
.ed-card { background: var(--code-bg); border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.ed-bar { display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 14px; border-bottom: 1px solid var(--code-line); color: var(--code-muted); font-family: var(--font-mono); font-size: .8rem; flex-wrap: wrap; }
.ed-bar .file { color: var(--code-ink); margin-right: auto; }
.ed-bar select, .ed-bar button { background: var(--code-line); color: var(--code-ink); border: 0; border-radius: 8px; padding: 6px 10px; font-family: var(--font-ui); font-size: .82rem; font-weight: 600; max-width: 200px; }
.editor { position: relative; height: clamp(280px, 48vh, 560px); display: grid; grid-template-columns: auto minmax(0, 1fr); overflow: hidden; }
.gutter { padding: 14px 10px 14px 12px; text-align: right; color: var(--code-muted); font-family: var(--font-mono); font-size: 14px; line-height: 1.6; user-select: none; border-right: 1px solid var(--code-line); min-width: 42px; overflow: hidden; }
.gutter-in, .ed-hl { will-change: transform; }
.gutter-in { white-space: pre; }
.ed-area { position: relative; overflow: hidden; }
.ed-hl, .ed-area textarea { margin: 0; padding: 14px 16px; font-family: var(--font-mono); font-size: 14px; line-height: 1.6; tab-size: 4; white-space: pre; letter-spacing: 0; font-variant-ligatures: none; }
.ed-hl { position: absolute; inset: 0 auto auto 0; color: var(--code-ink); pointer-events: none; min-width: 100%; }
.ed-area textarea { position: absolute; inset: 0; width: 100%; height: 100%; resize: none; border: 0; outline: none; background: transparent; color: transparent; caret-color: #FFFFFF; overflow: auto; -webkit-text-fill-color: transparent; }
.ed-area textarea::selection { background: rgba(126, 156, 255, .35); -webkit-text-fill-color: transparent; }
.keybar { display: flex; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--code-line); overflow-x: auto; scrollbar-width: none; }
.keybar button { flex: none; min-width: 40px; height: 38px; border: 0; border-radius: 8px; background: var(--code-line); color: var(--code-ink); font-family: var(--font-mono); font-size: .95rem; }
.keybar button:active { background: #2A3446; }
@media (pointer: fine) and (min-width: 900px) { .keybar { display: none; } }
.run-col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.stdin { border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
.stdin summary { padding: 10px 14px; font-weight: 600; font-size: .9rem; cursor: pointer; }
.stdin textarea { display: block; width: calc(100% - 20px); margin: 0 10px 10px; min-height: 64px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 8px 10px; font-family: var(--font-mono); font-size: .88rem; resize: vertical; }
.console { background: var(--code-bg); border-radius: var(--r); overflow: hidden; color: var(--code-ink); }
.console-bar { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--code-line); font-family: var(--font-mono); font-size: .76rem; text-transform: uppercase; letter-spacing: .06em; color: var(--code-muted); }
.console pre { margin: 0; padding: 12px 14px; min-height: 140px; max-height: 360px; overflow: auto; font-family: var(--font-mono); font-size: .86rem; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
.console .e { color: #FF8F96; }
.console .sys { color: var(--code-muted); }
.engine-note { font-size: .82rem; color: var(--muted); }

/* ---------- progress ---------- */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 700px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 4px; }
.tile b { font-family: var(--font-display); font-size: 1.8rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile span { font-size: .82rem; color: var(--muted); }
.lang-prog { display: grid; gap: 14px; }
.lang-prog .row { justify-content: space-between; font-size: .92rem; }
.lang-prog .row span { color: var(--muted); font-variant-numeric: tabular-nums; }
.howto { display: grid; gap: 12px; }
@media (min-width: 700px) { .howto { grid-template-columns: 1fr 1fr; } }

<script type="text/plain" id="js-worker">
const fmt = (v, d = 0) => {
  if (typeof v === "string") return d ? "'" + v + "'" : v;
  if (typeof v === "function") return "[Function " + (v.name || "anonym") + "]";
  if (Array.isArray(v)) return d > 2 ? "[Array]" : (v.length ? "[ " + v.map(x => fmt(x, d + 1)).join(", ") + " ]" : "[]");
  if (v instanceof Error) return v.name + ": " + v.message;
  if (v instanceof Promise) return "Promise { <pending> }";
  if (v instanceof Map) return "Map(" + v.size + ") { " + [...v].map(([k, x]) => fmt(k, d + 1) + " => " + fmt(x, d + 1)).join(", ") + " }";
  if (v instanceof Set) return "Set(" + v.size + ") { " + [...v].map(x => fmt(x, d + 1)).join(", ") + " }";
  if (v && typeof v === "object") {
    if (d > 2) return "[Object]";
    const name = v.constructor && v.constructor !== Object ? v.constructor.name + " " : "";
    const keys = Object.keys(v);
    return name + (keys.length ? "{ " + keys.map(k => k + ": " + fmt(v[k], d + 1)).join(", ") + " }" : "{}");
  }
  if (typeof v === "bigint") return v + "n";
  if (Object.is(v, -0)) return "-0";
  return String(v);
};
const send = (t, s) => postMessage({ t, s });
const line = (a) => a.map(x => fmt(x)).join(" ") + "\n";
console.log = console.info = console.debug = (...a) => send("out", line(a));
console.warn = console.error = (...a) => send("err", line(a));
console.table = (x) => send("out", fmt(x) + "\n");
const fail = (err) => send("err", (err && err.name ? err.name + ": " + err.message : "Fehler: " + fmt(err)) + "\n");
self.onunhandledrejection = (ev) => { ev.preventDefault(); fail(ev.reason); };
self.onmessage = async (e) => {
  const lines = e.data.stdin ? e.data.stdin.split("\n") : [];
  self.prompt = () => (lines.length ? lines.shift() : null);
  const st = setTimeout, ct = clearTimeout, si = setInterval, ci = clearInterval;
  const live = new Set();
  let mainDone = false, finished = false;
  const check = () => {
    if (mainDone && !live.size && !finished) st(() => { if (!live.size && !finished) { finished = true; send("done"); } }, 0);
  };
  self.setTimeout = (f, ms, ...a) => {
    const id = st(() => { live.delete(id); try { if (typeof f === "function") f(...a); } catch (err) { fail(err); } check(); }, ms);
    live.add(id); return id;
  };
  self.clearTimeout = (id) => { live.delete(id); ct(id); check(); };
  self.setInterval = (f, ms, ...a) => {
    const id = si(() => { try { f(...a); } catch (err) { fail(err); } }, Math.max(ms || 0, 10));
    live.add(id); return id;
  };
  self.clearInterval = (id) => { live.delete(id); ci(id); check(); };
  try {
    const AsyncFn = Object.getPrototypeOf(async function () {}).constructor;
    await new AsyncFn(e.data.code)();
  } catch (err) { fail(err); }
  mainDone = true;
  check();
};
</script>

<script type="text/plain" id="c-worker">
self.document = { baseURI: "https://cdn.jsdelivr.net/npm/picoc-web@1.1.0/dist/", currentScript: null };
self.onmessage = async (e) => {
  try { importScripts(e.data.url); } catch (err) { postMessage({ t: "unavailable", s: String(err) }); return; }
  postMessage({ t: "ready" });
  const input = e.data.stdin || "";
  let i = 0;
  try {
    await self.picocjs.RunInteractively(e.data.code, () => (i < input.length ? input.charCodeAt(i++) : null), (txt) => postMessage({ t: "out", s: txt + "\n" }));
    postMessage({ t: "done" });
  } catch (err) {
    postMessage({ t: "unavailable", s: String(err && err.message || err) });
  }
};
</script>

const LANG_ORDER = ["c", "py", "js"];

/* =====================================================================
   Hilfsfunktionen
   ===================================================================== */
const $ = (sel, root = document) => root.querySelector(sel);
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function inline(t) {
  return esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function today() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }

const KW = {
  c: new Set("auto break case char const continue default do double else enum extern float for goto if inline int long register return short signed sizeof static struct switch typedef union unsigned void volatile while NULL bool true false".split(" ")),
  py: new Set("False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield self".split(" ")),
  js: new Set("async await break case catch class const continue debugger default delete do else export extends false finally for function get if import in instanceof let new null of return set static super switch this throw true try typeof undefined var void while yield".split(" "))
};
const RX = {
  c: /(\/\/.*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(^[ \t]*#\w+)|(\b\d+(?:\.\d+)?[fFuUlL]*\b)|([A-Za-z_]\w*)/gm,
  py: /(#.*)|([fFrRbB]?"""[\s\S]*?"""|[fFrRbB]?"(?:\\.|[^"\\\n])*"|[fFrRbB]?'(?:\\.|[^'\\\n])*')|(@\w+)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)/gm,
  js: /(\/\/.*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|`(?:\\.|[^`\\])*`)|(#\w+)|(\b\d+(?:\.\d+)?n?\b)|([A-Za-z_$][\w$]*)/gm
};
function hl(code, lang) {
  const rx = new RegExp(RX[lang].source, "gm");
  const kw = KW[lang];
  let out = "", last = 0, m;
  while ((m = rx.exec(code))) {
    out += esc(code.slice(last, m.index));
    const t = m[0];
    let cls = m[1] ? "com" : m[2] ? "str" : m[3] ? "pre" : m[4] ? "num" : kw.has(t) ? "kw" : (/^\s*\(/.test(code.slice(rx.lastIndex, rx.lastIndex + 3)) ? "fn" : "");
    out += cls ? '<span class="t-' + cls + '">' + esc(t) + "</span>" : esc(t);
    last = rx.lastIndex;
  }
  return out + esc(code.slice(last));
}

/* Kleiner Markdown-Renderer für Antworten von Claude */
function md(src) {
  const parts = String(src).split(/```[^\n]*\n?/);
  let html = "";
  parts.forEach((part, i) => {
    if (i % 2 === 1) { html += "<pre><code>" + esc(part.replace(/\n$/, "")) + "</code></pre>"; return; }
    const lines = part.split("\n");
    let list = null, para = [];
    const flushP = () => { if (para.length) { html += "<p>" + inline(para.join(" ")) + "</p>"; para = []; } };
    const flushL = () => { if (list) { html += "<" + list.t + ">" + list.items.map(x => "<li>" + inline(x) + "</li>").join("") + "</" + list.t + ">"; list = null; } };
    for (const raw of lines) {
      const l = raw.trim();
      let mm;
      if (!l) { flushP(); flushL(); continue; }
      if ((mm = l.match(/^#{1,4}\s+(.*)/))) { flushP(); flushL(); html += "<h4>" + inline(mm[1]) + "</h4>"; continue; }
      if ((mm = l.match(/^[-*•]\s+(.*)/))) { flushP(); if (!list || list.t !== "ul") { flushL(); list = { t: "ul", items: [] }; } list.items.push(mm[1]); continue; }
      if ((mm = l.match(/^\d+[.)]\s+(.*)/))) { flushP(); if (!list || list.t !== "ol") { flushL(); list = { t: "ol", items: [] }; } list.items.push(mm[1]); continue; }
      flushL(); para.push(l);
    }
    flushP(); flushL();
  });
  return html;
}

   Fortschritt (lokal + Sync über das Claude-Konto)
   ===================================================================== */
const LS_KEY = "codepfad.progress.v1";
const LS_DRAFT = "codepfad.drafts.v1";
function blank() { return { done: {}, task: {}, quiz: {}, extra: 0, days: [], lang: "c", updated: 0 }; }
function loadLocal() { try { const v = JSON.parse(localStorage.getItem(LS_KEY)); return v && typeof v === "object" ? Object.assign(blank(), v) : blank(); } catch (e) { return blank(); } }
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(P)); } catch (e) {} }
function merge(a, b) {
  const r = blank();
  for (const k of ["done", "task"]) r[k] = Object.assign({}, a[k], b[k]);
  r.quiz = Object.assign({}, a.quiz);
  for (const [k, v] of Object.entries(b.quiz || {})) r.quiz[k] = Math.max(r.quiz[k] || 0, v || 0);
  r.extra = Math.max(a.extra || 0, b.extra || 0);
  r.days = [...new Set([...(a.days || []), ...(b.days || [])])].sort().slice(-180);
  const newer = (b.updated || 0) > (a.updated || 0) ? b : a;
  r.lang = COURSES[newer.lang] ? newer.lang : "c";
  r.updated = Math.max(a.updated || 0, b.updated || 0);
  return r;
}
let P = loadLocal();

const sync = { ref: null, state: "local", writing: false, dirty: false, timer: null };
function syncLabel() {
  return { local: "Nur auf diesem Gerät", synced: "Mit deinem Konto synchronisiert", saving: "Speichert …", error: "Sync fehlgeschlagen, lokal gespeichert" }[sync.state];
}
function paintSync() {
  for (const el of document.querySelectorAll("[data-sync]")) { el.dataset.s = sync.state; const s = el.querySelector("span"); if (s) s.textContent = syncLabel(); }
  const side = $("#sync-side"); side.dataset.s = sync.state; side.querySelector("span").textContent = syncLabel();
}
function touch() {
  const d = today();
  if (!P.days.includes(d)) P.days.push(d);
  P.updated = Date.now();
  saveLocal();
  if (!sync.ref) return;
  clearTimeout(sync.timer);
  sync.timer = setTimeout(flush, 1200);
}
async function flush() {
  if (!sync.ref) return;
  if (sync.writing) { sync.dirty = true; return; }
  sync.writing = true; sync.state = "saving"; paintSync();
  try {
    await sync.ref.set(JSON.parse(JSON.stringify(P)));
    sync.state = "synced";
  } catch (e) {
    if (e && (e.code === "invalid_argument" || e.code === "revoked" || e.code === "not_granted")) { sync.ref = null; sync.state = "local"; }
    else sync.state = "error";
  }
  sync.writing = false; paintSync();
  if (sync.dirty) { sync.dirty = false; flush(); }
}
async function initSync() {
  if (!window.claude || !window.claude.use) return;
  try {
    const [user, db] = await Promise.all([window.claude.use("user"), window.claude.use("db")]);
    if (!user || !db) return;
    const id = await user.id();
    if (!id) return;
    const ref = db.doc("data/users/" + id + "/progress");
    const snap = await ref.get();
    sync.ref = ref;
    sync.state = "synced";
    if (snap.exists) {
      const before = JSON.stringify(P);
      P = merge(P, snap.data());
      saveLocal();
      if (JSON.stringify(P) !== before && S.view !== "play") render();
      if (JSON.stringify(P) !== JSON.stringify(Object.assign(blank(), snap.data()))) flush();
    } else if (P.updated) {
      flush();
    }
    paintSync();
  } catch (e) { sync.ref = null; sync.state = "local"; paintSync(); }
}

/* XP wird aus dem Fortschritt berechnet, damit das Zusammenführen zweier Geräte nie doppelt zählt */
function xp() {
  return Object.keys(P.done).length * 15 + Object.keys(P.task).length * 25 + Object.values(P.quiz).filter(v => v === 1).length * 10 + (P.extra || 0) * 10;
}
function streak() {
  const set = new Set(P.days);
  const d = new Date();
  if (!set.has(today())) d.setDate(d.getDate() - 1);
  let n = 0;
  for (;;) {
    const k = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    if (!set.has(k)) break;
    n++; d.setDate(d.getDate() - 1);
  }
  return n;
}

const NAV = [["path", "Lernen", I.path], ["quiz", "Quiz", I.quiz], ["play", "Live-Code", I.play], ["prog", "Fortschritt", I.prog]];

/* =====================================================================

function renderChrome() {

function render() {
  renderChrome();

  if (S.view === "lesson") main.innerHTML = viewLesson();
  else if (S.view === "quiz") main.innerHTML = viewQuiz();
  else if (S.view === "play") { main.innerHTML = viewPlay(); mountEditor(); }
  else if (S.view === "prog") main.innerHTML = viewProg();

/* ---------- Lernpfad ---------- */

/* ---------- Lektion ---------- */
function codeBlock(src, lang, opts) {
  opts = opts || {};

  return '<figure class="code"><div class="code-bar"><span>' + esc(COURSES[lang].name) + "</span>" + tryBtn + "</div><pre><code>" + hl(src, lang) + "</code></pre></figure>";
}
function questionHTML(key, q, lang, order) {
  order = order || q.opts.map((_, i) => i);
  const chosen = S.answers[key];
  const answered = chosen !== undefined;
  const textOpts = q.opts.every(o => /\s/.test(o) && !/[;(){}=\[\]]/.test(o) || /^[A-Za-zÄÖÜäöü]/.test(o) && !/[;(){}=\[\]"']/.test(o));
  let html = '<div class="q" data-qkey="' + esc(key) + '"><p class="q-text">' + inline(q.q) + "</p>";
  if (q.code) html += codeBlock(q.code, lang);
  html += '<div class="opts">';
  order.forEach((oi, pos) => {
    let cls = "opt" + (textOpts ? " v-text" : "");
    if (answered) { if (oi === q.a) cls += " right"; else if (oi === chosen) cls += " wrong"; }
    html += '<button class="' + cls + '" data-act="answer" data-key="' + esc(key) + '" data-i="' + oi + '"' + (answered ? " disabled" : "") + '><span class="k">' + "ABCD"[pos] + '</span><span class="v">' + esc(q.opts[oi]) + "</span></button>";
  });
  html += "</div>";
  if (answered) {
    const ok = chosen === q.a;
    html += '<div class="why"><span class="verdict ' + (ok ? "ok" : "no") + '">' + (ok ? "Richtig!" : "Nicht ganz. Richtig ist " + "ABCD"[order.indexOf(q.a)] + ".") + "</span><p>" + inline(q.why || "") + "</p>"
      + '<div class="row">' + (key.startsWith("qz-") ? "" : '<button class="btn small ghost" data-act="retry" data-key="' + esc(key) + '">Nochmal versuchen</button>')
      + '<button class="btn small ghost ai-only" data-act="why" data-key="' + esc(key) + '">' + I.spark + "Claude erklären lassen</button></div>"
      + '<div class="answer" data-out="why-' + esc(key) + '"></div></div>';
  }
  return html + "</div>";
}
function viewLesson() {
  const found = lessonById(S.lessonId);

  html += '<section class="card" style="padding:0"><div style="padding:18px 18px 4px"><div class="section-title"><h2>Prüfe dein Wissen</h2><span class="muted">' + l.quiz.filter((q, i) => P.quiz[l.id + ":" + i] === 1).length + "/" + l.quiz.length + " richtig</span></div></div>";

    + "<p>" + inline(l.task.prompt) + "</p>"

    + '<div class="chips">'

    + '<button class="btn primary" data-act="complete" data-id="' + l.id + '">' + (P.done[l.id] ? (next ? "Weiter zur nächsten Lektion" : "Zurück zum Lernpfad") : "Lektion abschließen") + I.next + "</button></div>";
  return html + "</div>";

/* ---------- Quiz-Modus ---------- */
function poolFor(lang, level) {
  const out = [];
  for (const l of COURSES[lang].lessons) {
    if (level && l.level !== level) continue;
    l.quiz.forEach((q, i) => out.push({ key: l.id + ":" + i, q, from: l.title }));
  }
  return out;
}
function startQuiz(items, label) {
  S.quiz = { label, items: items.map(it => ({ ...it, order: shuffle(it.q.opts.map((_, i) => i)), skey: "qz-" + Math.random().toString(36).slice(2, 8) })), pos: 0, right: 0, wrong: [] };
  for (const it of S.quiz.items) delete S.answers[it.skey];
  go("quiz");
}
function viewQuiz() {
  const c = course();
  let html = '<div class="wrap">';
  const Q = S.quiz;
  if (Q && Q.pos < Q.items.length) {
    const it = Q.items[Q.pos];
    const answered = S.answers[it.skey] !== undefined;
    html += '<div class="quiz-top"><button class="back" data-act="quit-quiz">' + I.back + 'Beenden</button><div class="meter"><span style="width:' + Math.round(Q.pos / Q.items.length * 100) + '%"></span></div><span>' + (Q.pos + 1) + " / " + Q.items.length + "</span></div>";

  }
  if (Q) {

      + (pct === 100 ? "Perfekt. Zeit für die nächste Stufe." : pct >= 70 ? "Stark. Wiederhole die falschen Fragen, dann sitzt es." : "Guter Anfang. Lies die passenden Lektionen noch einmal und versuch es erneut.") + "</p>"
      + '<div class="row">' + (Q.wrong.length ? '<button class="btn primary" data-act="quiz-wrong">' + Q.wrong.length + " falsche wiederholen</button>" : "")

  }

  html += '<section class="card hero"><span class="eyebrow">' + esc(c.name) + " · Quiz</span><h1>Teste dich mit Code-Fragen</h1><p>Zufällige Multiple-Choice-Fragen aus allen Lektionen. Antworten werden gemischt, nach jeder Frage siehst du die Erklärung.</p>"
    + '<div class="field"><label>Stufe</label><div class="seg" role="group" aria-label="Stufe">' + lvls.map(([v, t]) => '<button data-act="qlevel" data-v="' + v + '" aria-pressed="' + (S.quizLevel === v) + '">' + t + "</button>").join("") + "</div></div>"
    + '<div class="row"><button class="btn primary" data-act="quiz-start"' + (pool.length ? "" : " disabled") + ">" + Math.min(10, pool.length) + " Fragen starten" + I.next + '</button><span class="muted">' + pool.length + " Fragen verfügbar</span></div></section>";
  html += '<section class="card ai-only"><div class="tutor"><div class="section-title"><h2>Neue Fragen von Claude</h2><span class="muted">unbegrenzt üben</span></div>'
    + "<p class=\"muted\">Claude schreibt dir fünf frische Fragen auf deinem Niveau, mit Code und Erklärung.</p>"
    + '<div class="seg" role="group" aria-label="Niveau">' + [1, 2, 3].map(v => '<button data-act="glevel" data-v="' + v + '" aria-pressed="' + (S.gen.level === v) + '">' + LEVELS[v] + "</button>").join("") + "</div>"
    + '<div class="row"><button class="btn primary" data-act="gen"' + (S.gen.busy ? " disabled" : "") + ">" + I.spark + (S.gen.busy ? '<span class="dots">Claude schreibt Fragen</span>' : "5 Fragen erzeugen") + "</button></div>"
    + (S.gen.error ? '<p class="answer"><span class="err">' + esc(S.gen.error) + "</span></p>" : "")

  return html + "</div>";
}

function engineNote() {

    ? "C läuft direkt im Browser über PicoC, einen C-Interpreter als WebAssembly. Zeiger, structs, malloc und die Standardbibliothek sind dabei. Für große Projekte nimmst du später gcc oder clang. Strg + Enter führt den Code aus."

function keybarKeys() {

  if (S.lang === "py") return [["Tab", "\t"], [":", ":"], ["(", "("], [")", ")"], ["[", "["], ["]", "]"], ["{", "{"], ["}", "}"], ["\"", "\""], ["'", "'"], ["=", "="], ["<", "<"], [">", ">"], ["+", "+"], ["-", "-"], ["*", "*"], ["/", "/"], ["%", "%"], ["#", "#"], ["_", "_"]];

/* ---------- Fortschritt ---------- */
function viewProg() {

    + '<div class="tile"><b>' + doneAll + "/" + totalAll + '</b><span>Lektionen</span></div><div class="tile"><b>' + acc + "</b><span>Quiz-Trefferquote</span></div></div>";
  html += '<section class="card lang-prog"><h2>Sprachen</h2>';

let ED = null;
function mountEditor() {
  const ta = $("#pg-code"), pre = $("#ed-hl"), gut = $("#gutter");
  const d = draft(S.lang);
  ta.value = d.code;
  const lang = S.lang;
  const paint = () => {
    pre.innerHTML = hl(ta.value, lang) + "\n";
    const n = ta.value.split("\n").length;
    let g = "";
    for (let i = 1; i <= n; i++) g += i + "\n";
    gut.textContent = g;
    syncScroll();
  };
  const syncScroll = () => {
    pre.style.transform = "translate(" + (-ta.scrollLeft) + "px," + (-ta.scrollTop) + "px)";
    gut.style.transform = "translateY(" + (-ta.scrollTop) + "px)";
  };
  let saveT;
  const persist = () => { clearTimeout(saveT); saveT = setTimeout(() => saveDraft(lang, { code: ta.value, stdin: $("#pg-stdin") ? $("#pg-stdin").value : "" }), 300); };
  ta.addEventListener("input", () => { paint(); persist(); });
  ta.addEventListener("scroll", syncScroll);
  $("#pg-stdin").addEventListener("input", persist);
  const indentUnit = lang === "js" ? "  " : "    ";
  const insert = (text) => {
    ta.focus();
    const s = ta.selectionStart, e = ta.selectionEnd;
    ta.setRangeText(text, s, e, "end");
    paint(); persist();
  };
  ta.addEventListener("keydown", (ev) => {
    if (ev.key === "Tab" && !ev.ctrlKey && !ev.altKey && !ev.metaKey) {
      ev.preventDefault();
      if (ev.shiftKey) {
        const s = ta.selectionStart, lineStart = ta.value.lastIndexOf("\n", s - 1) + 1;
        const lead = ta.value.slice(lineStart).match(/^ */)[0].length;
        const rm = Math.min(lead, indentUnit.length);
        if (rm) { ta.setRangeText("", lineStart, lineStart + rm, "preserve"); ta.selectionStart = ta.selectionEnd = Math.max(lineStart, s - rm); paint(); persist(); }
      } else insert(indentUnit);
    } else if (ev.key === "Enter" && !ev.isComposing) {
      ev.preventDefault();
      const s = ta.selectionStart;
      const lineStart = ta.value.lastIndexOf("\n", s - 1) + 1;
      const line = ta.value.slice(lineStart, s);
      let ind = line.match(/^[ \t]*/)[0];
      const trimmed = line.trimEnd();
      if (/[{(\[]$/.test(trimmed) || (lang === "py" && /:$/.test(trimmed))) ind += indentUnit;
      const after = ta.value.slice(s, s + 1);
      if (/[{(\[]$/.test(trimmed) && /[}\)\]]/.test(after)) {
        insert("\n" + ind + "\n" + ind.slice(indentUnit.length));
        ta.selectionStart = ta.selectionEnd = s + 1 + ind.length;
      } else insert("\n" + ind);
    } else if ((ev.ctrlKey || ev.metaKey) && ev.key === "Enter") {
      ev.preventDefault(); runCode();
    }
  });
  const kb = $("#keybar");
  kb.addEventListener("pointerdown", (ev) => { if (ev.target.closest("button")) ev.preventDefault(); });
  kb.addEventListener("click", (ev) => {
    const b = ev.target.closest("button"); if (!b) return;
    const k = b.dataset.key;
    insert(k === "\t" ? indentUnit : k);
  });
  $("#pg-example").addEventListener("change", (ev) => {
    const v = ev.target.value; if (!v) return;
    const [id, bi] = v.split(":");
    const { l } = lessonById(id);
    const b = l.body[+bi];
    setEditor(runnable(b[1], S.lang), (b[2] && b[2].stdin) || "");
    ev.target.value = "";
  });
  ED = { ta, paint, set: (code, stdin) => { ta.value = code; $("#pg-stdin").value = stdin || ""; if (stdin) $(".stdin").open = true; paint(); saveDraft(lang, { code, stdin: stdin || "" }); ta.scrollTop = 0; } };
  paint();
}
function setEditor(code, stdin) { if (ED) ED.set(code, stdin); }
function runnable(src, lang) {
  if (lang !== "c" || /\bmain\s*\(/.test(src)) return src;
  let body = src.split("\n").filter(l => !/^\s*#include/.test(l)).join("\n");
  // Typdefinitionen gehören vor main
  const types = [];
  body = body.replace(/^struct\s+\w+\s*\{[\s\S]*?^\};[ \t]*\n?/gm, (m) => { types.push(m.trim()); return ""; }).trim();
  return "#include <stdio.h>\n#include <string.h>\n#include <stdlib.h>\n\n" + (types.length ? types.join("\n\n") + "\n\n" : "") + "int main(void) {\n" + body.split("\n").map(l => l ? "    " + l : l).join("\n") + "\n    return 0;\n}\n";
}

const CDN = {
  picoc: "https://cdn.jsdelivr.net/npm/picoc-web@1.1.0/dist/bundle.iife.js",
  jscpp: "https://cdn.jsdelivr.net/npm/JSCPP@2.0.6/dist/JSCPP.es5.min.js",
  sk: "https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js",
  skstd: "https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"
};
const scriptCache = {};
function loadScript(src) {
  if (!scriptCache[src]) {
    scriptCache[src] = new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = src; s.async = true;
      s.onload = resolve;
      s.onerror = () => { delete scriptCache[src]; reject(new Error("Der Interpreter konnte nicht geladen werden. Prüfe deine Internetverbindung.")); };
      document.head.appendChild(s);
    });
  }
  return scriptCache[src];
}
/* C: PicoC (WebAssembly) in einem Worker, damit Endlosschleifen abgebrochen werden können.
   Kann der Browser kein WebAssembly laden, springt JSCPP ein. */
let cEngine = "picoc";
function runPicoc(code, stdin, out, err, onStatus) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(new Blob([$("#c-worker").textContent], { type: "text/javascript" }));
    const w = new Worker(url);
    let ended = false, timer;
    const end = (v) => { if (ended) return; ended = true; clearTimeout(timer); w.terminate(); URL.revokeObjectURL(url); resolve(v); };
    timer = setTimeout(() => end("unavailable"), 45000);
    w.onmessage = (e) => {
      const m = e.data;
      if (m.t === "ready") {
        if (onStatus) onStatus("läuft …");
        clearTimeout(timer);
        timer = setTimeout(() => { err("Abgebrochen: Das Programm lief länger als 6 Sekunden (Endlosschleife?).\n"); end("ok"); }, 6000);
      } else if (m.t === "out") {
        const pe = m.s.match(/^file\.c:(\d+):(\d+)\s+(.*)/);
        if (pe) err("Fehler in Zeile " + pe[1] + ", Spalte " + pe[2] + ": " + pe[3] + "\n");
        else out(m.s);
      } else if (m.t === "done") {
        end("ok");
      } else if (m.t === "unavailable") end("unavailable");
    };
    w.onerror = (e) => { e.preventDefault(); end("unavailable"); };
    w.postMessage({ code, stdin, url: CDN.picoc });
  });
}
async function runC(code, stdin, out, err, onStatus) {
  if (cEngine === "picoc") {
    const r = await runPicoc(code, stdin, out, err || out, onStatus);
    if (r === "ok") return 0;
    cEngine = "jscpp";
  }
  await loadScript(CDN.jscpp);
  const J = window.JSCPP && (window.JSCPP.run ? window.JSCPP : window.JSCPP.default);
  return J.run(code.replace(/\(\s*void\s*\)/g, "()"), stdin || "", { stdio: { write: (s) => out(String(s)) } });
}
async function runPy(code, stdin, out) {
  await loadScript(CDN.sk);
  await loadScript(CDN.skstd);
  const lines = stdin ? stdin.split("\n") : [];
  const start = Date.now();
  window.Sk.configure({
    output: (s) => out(s),
    read: (f) => { const files = window.Sk.builtinFiles && window.Sk.builtinFiles.files; if (!files || files[f] === undefined) throw "Datei nicht gefunden: " + f; return files[f]; },
    __future__: window.Sk.python3,
    inputfunTakesPrompt: true,
    inputfun: (p) => { const v = lines.length ? lines.shift() : ""; out((p || "") + v + "\n"); return v; },
    yieldLimit: 100
  });
  await window.Sk.misceval.asyncToPromise(
    () => window.Sk.importMainWithBody("<stdin>", false, code, true),
    { "*": () => { if (Date.now() - start > 6000) throw new Error("Zeitlimit von 6 Sekunden überschritten (Endlosschleife?)"); } }
  );
}
function runJS(code, stdin, out, err) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(new Blob([$("#js-worker").textContent], { type: "text/javascript" }));
    const w = new Worker(url);
    let ended = false;
    const end = (msg) => { if (ended) return; ended = true; clearTimeout(timer); w.terminate(); URL.revokeObjectURL(url); if (msg) err(msg); resolve(); };
    const timer = setTimeout(() => end("Abgebrochen: Das Programm lief länger als 6 Sekunden (Endlosschleife oder offener Timer?).\n"), 6000);
    w.onmessage = (e) => { const { t, s } = e.data; if (t === "out") out(s); else if (t === "err") err(s); else if (t === "done") end(); };
    w.onerror = (e) => { e.preventDefault(); end((e.message || "Fehler") + "\n"); };
    w.postMessage({ code, stdin });
  });
}
function errText(e) {
  if (!e) return "Unbekannter Fehler";
  if (typeof e === "string") return e;
  if (e.toString && e.toString !== Object.prototype.toString) return e.toString();
  return e.message || String(e);
}
let running = false;
let lastRun = { out: "", err: "" };
async function runCode() {
  if (running || !ED) return;
  running = true;
  const code = ED.ta.value, stdin = $("#pg-stdin").value, lang = S.lang;
  const pre = $("#pg-out"), state = $("#run-state"), btn = $("#run-btn");
  pre.textContent = ""; state.textContent = "läuft …"; btn.disabled = true;
  let stdout = "", stderr = "";
  const out = (s) => { stdout += s; pre.appendChild(document.createTextNode(s)); pre.scrollTop = pre.scrollHeight; };
  const err = (s) => { stderr += s; const sp = document.createElement("span"); sp.className = "e"; sp.textContent = s; pre.appendChild(sp); pre.scrollTop = pre.scrollHeight; };
  const t0 = performance.now();
  try {
    if (lang === "c") {
      state.textContent = "lädt C-Interpreter …";
      const exit = await runC(code, stdin, out, err, (s) => { state.textContent = s; });
      if (exit !== 0 && exit !== undefined) err("\nProgramm beendet mit Code " + exit + "\n");
    } else if (lang === "py") {
      if (!window.Sk) state.textContent = "lädt Python …";
      await runPy(code, stdin, out);
    } else {
      await runJS(code, stdin, out, err);
    }
  } catch (e) {
    err((stdout && !stdout.endsWith("\n") ? "\n" : "") + errText(e) + "\n");
  }
  const ms = Math.round(performance.now() - t0);
  if (!stdout && !stderr) { const sp = document.createElement("span"); sp.className = "sys"; sp.textContent = "(keine Ausgabe)"; pre.appendChild(sp); }
  state.textContent = "fertig in " + ms + " ms";
  btn.disabled = false;
  running = false;
  lastRun = { out: stdout, err: stderr };
  touch();
  checkTask(stdout, stderr);
}
function norm(s) { const l = String(s).replace(/\r/g, "").split("\n").map(x => x.trimEnd()); while (l.length && !l[l.length - 1]) l.pop(); return l; }
function checkTask(stdout, stderr) {
  const t = S.task;
  if (!t || t.lang !== S.lang) return;
  const l = lessonById(t.id).l;
  const want = norm(l.task.expect), got = norm(stdout);
  const ok = !stderr.trim() && got.length >= want.length && want.every((w, i) => got[got.length - want.length + i] === w);
  t.result = ok ? "ok" : "no";
  if (ok && !P.task[t.id]) { P.task[t.id] = true; touch(); }
  // nur den Übungsbanner neu zeichnen, Editor bleibt erhalten
  const box = $(".pg-task");
  if (box) {
    const tmp = document.createElement("div");
    tmp.innerHTML = viewPlay();
    box.replaceWith(tmp.querySelector(".pg-task"));
  }
}

    case "try": {

      if (!P.done[id]) { P.done[id] = true; touch(); }
      const ls = COURSES[lang].lessons, nx = ls[ls.indexOf(l) + 1];
      if (nx) go("lesson", { lessonId: nx.id }); else go("path");
      break;
    }
    case "answer": {
      const key = el.dataset.key, i = +el.dataset.i;
      if (S.answers[key] !== undefined) break;
      S.answers[key] = i;
      const f = findQuestion(key);
      const ok = f && i === f.q.a;
      if (key.startsWith("qz-")) {
        const it = S.quiz.items[S.quiz.pos];
        if (ok) S.quiz.right++; else S.quiz.wrong.push(it);
        if (it.key) P.quiz[it.key] = Math.max(P.quiz[it.key] || 0, ok ? 1 : 0);
        else if (ok) P.extra = (P.extra || 0) + 1;
      } else {
        P.quiz[key] = Math.max(P.quiz[key] || 0, ok ? 1 : 0);
      }
      touch();
      rerenderQuestion(key);
      break;
    }
    case "retry": delete S.answers[el.dataset.key]; rerenderQuestion(el.dataset.key); break;
    case "why": whyAsk(el.dataset.key); break;
    case "tutor": tutorAsk(el.dataset.q); break;
    case "qlevel": S.quizLevel = +el.dataset.v; render(); break;
    case "glevel": S.gen.level = +el.dataset.v; render(); break;
    case "quiz-start": {
      const pool = shuffle(poolFor(S.lang, S.quizLevel)).slice(0, 10);
      startQuiz(pool, COURSES[S.lang].name + " · " + (S.quizLevel ? LEVELS[S.quizLevel] : "Alle Stufen"));
      break;
    }
    case "quiz-next": S.quiz.pos++; render(); window.scrollTo(0, 0); break;
    case "quiz-wrong": startQuiz(S.quiz.wrong, "Wiederholung"); break;
    case "quit-quiz": S.quiz = null; render(); break;
    case "gen": if (!S.gen.busy) generateQuestions(); break;
    case "run": runCode(); break;
    case "review": reviewAsk(); break;
    case "pg-reset": {
      const t = S.task && S.task.lang === S.lang ? lessonById(S.task.id).l : null;
      setEditor(t ? t.task.starter : course().starter, t ? (t.task.stdin || "") : "");
      break;
    }
    case "reset": S.confirmReset = true; render(); break;
    case "reset-no": S.confirmReset = false; render(); break;
    case "reset-yes": {
      const lang = P.lang;
      P = blank(); P.lang = lang; S.answers = {}; S.confirmReset = false;
      P.updated = Date.now(); saveLocal(); if (sync.ref) flush();
      render();
      break;
    }
  }
});
document.addEventListener("submit", (ev) => {
  const f = ev.target.closest("[data-act='tutor-form']");
  if (!f) return;
  ev.preventDefault();
  const inp = $("#tutor-q");
  const q = inp.value.trim();
  if (q) { tutorAsk(q); inp.value = ""; }
});
function rerenderQuestion(key) {
  const node = document.querySelector('.q[data-qkey="' + CSS.escape(key) + '"]');
  if (S.view === "quiz") { render(); return; }
  if (!node) { render(); return; }
  const f = findQuestion(key);
  const tmp = document.createElement("div");
  tmp.innerHTML = questionHTML(key, f.q, f.lang);
  node.replaceWith(tmp.firstElementChild);
  // Zähler "x/3 richtig" aktualisieren
  const found = lessonById(S.lessonId);
  const cnt = document.querySelector(".card .section-title .muted");
  if (found && cnt) cnt.textContent = found.l.quiz.filter((q, i) => P.quiz[found.l.id + ":" + i] === 1).length + "/" + found.l.quiz.length + " richtig";
}

/* =====================================================================
   Start
   ===================================================================== */
render();
initSync();
getSample().then((s) => { if (s) { S.ai = true; document.documentElement.dataset.ai = "1"; } });
</script>
