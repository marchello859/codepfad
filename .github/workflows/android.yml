name: Android-APK bauen

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Beim ersten Lauf einen festen Signaturschlüssel anlegen und speichern,
      # damit spätere APKs die installierte App ersetzen können.
      - name: Signaturschlüssel
        run: |
          if [ ! -f android/codepfad.keystore ]; then
            keytool -genkeypair -keystore android/codepfad.keystore -alias codepfad -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass codepfad -keypass codepfad -dname "CN=Codepfad"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android/codepfad.keystore
            git commit -m "Signaturschlüssel für die APK anlegen"
            git push
          fi

      - name: APK bauen
        env:
          CODEPFAD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          gradle -p android assembleRelease --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk codepfad.apk

      - name: Als Download bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view apk >/dev/null 2>&1; then
            gh release upload apk codepfad.apk --clobber
          else
            gh release create apk codepfad.apk --title "Codepfad für Android" \
              --notes "Lade codepfad.apk auf deinem Handy herunter und öffne die Datei. Inhalte aktualisieren sich danach von selbst."
          fi
